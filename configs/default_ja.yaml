    category: neutral
    text: 今日は予定どおり、午後から新しい作業を始めます。
  - id: e02
    category: question
    text: この近くに、静かに話せる場所はありますか？
  - id: e03
    category: expressive
    text: わあ、間に合った。本当によかった。
  - id: e04
    category: numbers
    text: 受付番号は二〇四八、予約日は十一月六日です。
  - id: e05
    category: loanword
    text: オンラインサービスの設定を、もう一度確認してください。
  - id: e06
    category: narration
    text: 柔らかな光が部屋に差し込み、机の上の白い封筒を静かに照らしていました。
  - id: e07
    category: conditional
    text: もし結果が違っていたら、条件を変えてもう一度試してみましょう。
  - id: e08
    category: very-short
    text: はい、承知しました。
