candidate_prompts:
  - id: c01
    category: neutral
    text: 今朝は青い空を見ながら、駅までゆっくり歩きました。途中で小さな公園に立ち寄り、ベンチのそばで今日の予定を静かに確かめました。
  - id: c02
    category: objects
    text: この箱には、赤い鍵と小さな時計がはいっています。棚の上には青い手帳と白い封筒もあるので、忘れずに一緒に持ってきてください。
  - id: c03
    category: question
    text: すみません、次の角を右に曲がれば、市役所に着きますか？そのあと図書館へ行きたいのですが、駅前の大きな交差点を渡る道がいちばん近いでしょうか？
  - id: c04
    category: loanword
    text: 昨日の夕方、近所のパン屋で焼きたてのクロワッサンを二つ買いました。カフェラテとサンドイッチも注文して、テラスでゆっくりランチを楽しみました。
  - id: c05
    category: descriptive
    text: 春の風が桜の枝を揺らし、川面に淡い花びらが静かに落ちていきます。夕暮れの光が水面を照らし、遠くの山には薄い雲が流れています。
  - id: c06
    category: explanatory
    text: まず資料を確認してから、予定と費用を順番にわかりやすく説明します。そのあと質問を確認し、必要な作業と締め切りを整理します。
  - id: c07
    category: expressive
    text: えっ、本当に？それは知らなかった。あとで詳しく教えてください。驚いたけれど、聞いているうちに私までうれしくなってきました。
  - id: c08
    category: consonant-rich
    text: 新しい靴で坂道を走ったら、思ったより早く電車に間に合いました。改札を抜けて座席に座り、しばらく静かに息を整えました。
  - id: c09
    category: vowel-nasal
    text: 母は朝、白い皿に卵と野菜を並べ、温かいお茶をゆっくり注いでから窓をあけました。庭からやわらかな風が入ってきました。
  - id: c10
    category: numbers
    text: しちがつにじゅうさんにちの午後三時に、第二会議室で新しい計画について打ち合わせを始めます。参加者は八人で、終了予定は午後四時半です。
  - id: c11
    category: narration
    text: 静かな図書館で古い地図を開くと、遠い港町へ続くほそいみちが丁寧に描かれていました。隅には小さな灯台と古い船も描かれていました。
  - id: c12
    category: emotional-long
    text: 今日は少し疲れていたけれど、帰り道で友人の笑顔を見たら、自然と元気が戻ってきました。また来週会おうと約束し、笑顔で別れました。
anchor_prompts:
  - id: a01
    text: 私の声の特徴を確認するため、落ち着いた速さでこの文章を読んでいます。
  - id: a02
    text: 季節が変わっても、毎日の小さな出来事を丁寧に覚えていたいと思います。
  - id: a03
    text: 質問に答えるときは、言葉を選びながら自然にはっきり話します。
