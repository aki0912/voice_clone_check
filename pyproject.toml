[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-clone-check"
version = "0.1.0"
description = "Local Japanese reference-prompt explorer for Qwen3-TTS on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio>=5.49,<7",
  "jinja2>=3.1,<4",
  "mlx-audio>=0.3.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "numpy>=1.26,<3",
  "onnxruntime>=1.22,<2",
  "pykakasi>=2.3,<3",
  "pyyaml>=6,<7",
  "scipy>=1.12,<2",
  "soundfile>=0.12,<1",
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
voice-clone-check = "voice_clone_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_clone_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
